# ─────────────────────────────────────────────────────────────
# ARCHIVO DE EJEMPLO — copia esto como application.yml
# y reemplaza los valores con tus credenciales reales
# ─────────────────────────────────────────────────────────────

server:
  port: 8080
  error:
    include-stacktrace: never


# --- API EXTERNA Gutendex ---
gutendex:
  api:
    baseurl: https://gutendex.com

spring:
  application:
    name: literatura-api

  datasource:
    url: jdbc:postgresql://localhost:5432/NOMBRE_DATA_BASE_POSTGRESQL
    username: TU_USUARIO_POSTGRESQL  # Ejemplo: Postgresql
    password: Tu_PASSWORD_POSTGRESQL  # Ejemplo: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        
        
# --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    serialization:
      INDENT_OUTPUT: true


# --- CORS ---
cors:
  allowed-origins: "http://localhost:5173, http://localhost:3000"
  allowed-methods: "GET, POST, PUT, DELETE, OPTIONS"
  allowed-headers: "*"
  allow-credentials: true


# --- LOGGING ----
logging:
  level:
    root: INFO
    com.LiteraturaAPI: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
#    com.zaxxer.hikari:  DEBUG